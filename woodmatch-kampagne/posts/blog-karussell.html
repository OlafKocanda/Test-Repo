<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><title>Blog-Karussell</title>
<link rel="stylesheet" href="shared.css">
<style>
  #stage { background: var(--paper); }
  .kick { color: var(--green); }
  em { font-style: normal; color: var(--green); }
  .nw { white-space: nowrap; }
  .dark .kick { color: var(--mint); } .dark em { color: var(--mint); } .dark .h { color: #fff; } .dark .p { color: rgba(255,255,255,.85); }
  .row { display: flex; justify-content: space-between; align-items: baseline; padding: 26px 0; border-bottom: 2px solid #e3eadf; font-size: 44px; font-weight: 600; }
  .row b { font-weight: 800; }
  .row.hl { color: var(--green); border-bottom: none; }
  .row.hl b { font-size: 52px; }
  .item { display: flex; align-items: center; gap: 28px; font-size: 44px; font-weight: 700; padding: 18px 0; line-height: 1.15; }
  .item i { width: 68px; height: 68px; border-radius: 18px; background: #e2f2e1; color: var(--green); display: grid; place-items: center; font-style: normal; font-size: 34px; font-weight: 800; flex: none; }
  .col { position: absolute; left: 90px; right: 90px; top: 200px; display: flex; flex-direction: column; gap: 44px; }
  .col .h, .col .p, .col .card, .col .big { position: static; }
  .big { margin-left: -8px; font-weight: 800; letter-spacing: -.04em; line-height: .9; color: var(--green); }
  .page { position: absolute; right: 90px; top: 110px; font-size: 26px; font-weight: 700; color: var(--muted); letter-spacing: .1em; }
  .dark .page { color: rgba(255,255,255,.6); }
</style></head>
<body><div id="stage"></div>
<script src="shared.js"></script>
<script src="blog-data.js"></script>
<script>
const key = new URLSearchParams(location.search).get('k') || 'waldwert';
const D = BLOG[key], N = D.slides.length, WW = N * W;
const C = '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#2d8d31" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
const seed = [...key].reduce((a, c) => a + c.charCodeAt(0), 0);
const bg =
  `<div class="abs" style="left:0;top:0;width:${W}px;height:1350px;background:var(--forest)"></div>` +
  topoSVG(WW, seed % 97 + 3, '#2d8d31', .12) +
  forestSVG(WW, seed % 53 + 5, [
    { y: 1270, hill: 50, step: 75, scale: .65, spruce: .55, tree: '#cfe3c6', ground: '#cfe3c6' },
    { y: 1320, hill: 30, step: 60, scale: .8, spruce: .55, tree: '#9cc79a', ground: '#9cc79a' },
    { y: 1350, hill: 20, step: 55, scale: .9, spruce: .55, tree: '#2d8d31', ground: '#2d8d31' },
  ]);

const page = i => `<div class="page">${i + 1} / ${N}</div>`;
const hs = (s, base) => Math.round(base * (s.h.replace(/<[^>]+>/g, '').length > 42 ? .82 : 1));
const R = {
  cover: s => `<div class="kick"><i></i>${s.kick}</div>
    <div class="col" style="top:220px;gap:60px"><div class="h" style="font-size:${hs(s, 116)}px">${s.h}</div><div class="p">${s.p}</div></div>
    <div class="swipe" style="background:var(--mint);color:var(--deep);bottom:220px;left:90px;right:auto">Wischen →</div>`,
  text: s => `<div class="kick"><i></i>${s.kick}</div>
    <div class="col"><div class="h" style="font-size:${hs(s, 92)}px">${s.h}</div>
    <div class="p" style="color:var(--muted)">${s.p}</div>
    ${s.card ? `<div class="card" style="padding:42px 50px;margin-top:20px"><div style="font-size:42px;font-weight:800;line-height:1.22">${s.card}</div></div>` : ''}</div>`,
  list: s => `<div class="kick"><i></i>${s.kick}</div>
    <div class="col"><div class="h" style="font-size:${hs(s, 88)}px">${s.h}</div>
      <div>${s.items.map((it, i) => `<div class="item"><i>${s.num ? i + 1 : C}</i>${it}</div>`).join('')}</div></div>`,
  stats: s => `<div class="kick"><i></i>${s.kick}</div>
    <div class="col"><div class="h" style="font-size:${hs(s, 88)}px">${s.h}</div>
    ${s.note ? `<div class="p" style="font-size:34px;color:var(--muted);margin-bottom:-20px">${s.note}</div>` : ''}
    <div class="card" style="padding:20px 50px">
      ${s.rows.map((r, i) => `<div class="row${i === s.hl ? ' hl' : ''}"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div></div>`,
  big: s => `<div class="kick"><i></i>${s.kick}</div>
    <div class="col" style="top:190px"><div class="big" style="font-size:${s.big.length > 6 ? 190 : 300}px">${s.big}</div>
    <div class="h" style="font-size:${hs(s, 72)}px">${s.h}</div>
    <div class="p" style="color:var(--muted)">${s.p}</div></div>`,
  cta: s => `<div class="logo abs" style="left:90px;top:100px;font-size:56px"><span class="w">Wood</span><span class="m">Match</span></div>
    <div class="col" style="top:210px"><div class="h" style="font-size:88px">${s.h}</div>
    <div class="p" style="color:var(--muted)">${s.p}</div>
    <div style="display:flex;align-items:center;gap:30px;margin-top:30px"><div class="btn" style="width:560px;height:110px;font-size:42px">Kostenlos starten →</div>
    <div style="font-size:34px;font-weight:700">app.woodmatch.de</div></div>
    <div style="font-size:30px;font-weight:600;color:var(--muted)">Ganzer Artikel: Link in Bio · ${D.url}</div></div>`,
};
const slides = D.slides.map((s, i) => `<div class="${i === 0 ? 'dark' : ''}" style="position:absolute;inset:0">${R[s.t](s)}${i && s.t !== 'cta' ? page(i) : ''}</div>`);
buildStage(N, bg, slides);
window.ready = document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.decode().catch(() => {}))));
</script></body></html>

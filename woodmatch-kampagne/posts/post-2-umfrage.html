<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><title>Post 2 – Umfrage</title>
<link rel="stylesheet" href="shared.css">
<style>
  #stage { background: var(--forest); }
  .opt { position: absolute; left: 90px; right: 90px; height: 120px; border-radius: 28px; background: rgba(255,255,255,.08); border: 2px solid rgba(132,214,138,.45); display: flex; align-items: center; gap: 30px; padding: 0 40px; color: #fff; font-size: 46px; font-weight: 700; }
  .opt b { width: 70px; height: 70px; border-radius: 50%; background: var(--mint); color: var(--deep); display: grid; place-items: center; font-size: 38px; flex: none; }
</style></head>
<body><div id="stage"></div>
<script src="shared.js"></script>
<script>
const N = 1, WW = N * W;
const bg = topoSVG(WW, 53, '#84d68a', .10) +
  forestSVG(WW, 21, [
    { y: 1290, hill: 40, step: 70, scale: .65, spruce: .6, tree: '#2c4d2d', ground: '#2c4d2d' },
    { y: 1350, hill: 20, step: 55, scale: .8, spruce: .6, tree: '#142818', ground: '#142818' },
  ]);
const slides = [
  `<div class="kick" style="color:var(--mint)"><i></i>Deine Meinung zählt</div>
   <div class="h" style="top:190px;font-size:88px;color:#fff">Was beschäftigt dich als Waldbesitzer <span style="color:var(--mint)">gerade am meisten?</span></div>
   <div class="opt" style="top:540px"><b>A</b>Borkenkäfer & Schäden</div>
   <div class="opt" style="top:690px"><b>B</b>Holzpreise & Verkauf</div>
   <div class="opt" style="top:840px"><b>C</b>Wald geerbt – was nun?</div>
   <div class="opt" style="top:990px"><b>D</b>Pflege & Förderung</div>
   <div class="logo abs" style="right:90px;bottom:70px;font-size:40px"><span style="color:var(--mint)">Wood</span><span style="color:#fff">Match</span></div>`,
];
buildStage(N, bg, slides);
window.ready = document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.decode().catch(() => {}))));
</script></body></html>
